services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness}
      POSTGRES_DB: fitness
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Applique les migrations puis le seed (catalogue d'équipements), puis se termine.
  # `app` attend la fin de ce conteneur : s'il se bloque, c'est tout le déploiement
  # qui reste figé sans message (cas vécu sur Coolify). D'où les `timeout` :
  # mieux vaut un échec lisible en 3 min qu'une attente infinie.
  migrate:
    build:
      context: .
      target: builder
    command: >
      sh -ce "
      echo '→ prisma migrate deploy' ;
      timeout 180 ./node_modules/.bin/prisma migrate deploy ;
      echo '→ prisma db seed' ;
      timeout 180 ./node_modules/.bin/prisma db seed ;
      echo '✓ base prête'
      "
    environment:
      DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD:-fitness}@db:5432/fitness
      # La CLI Prisma interroge checkpoint.prisma.io au lancement (vérification de
      # version). Sur un serveur au réseau sortant filtré, cet appel peut traîner.
      CHECKPOINT_DISABLE: "1"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:3000"
    environment:
      DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD:-fitness}@db:5432/fitness
      KIE_API_KEY: ${KIE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Le calendrier de suivi utilise la date locale du serveur.
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Mode développement avec mise à jour automatique : `next dev` + HMR.
  # Lancer avec : docker compose --profile dev watch dev
  # Chaque modification du code est synchronisée dans le conteneur (rechargement
  # instantané) ; un changement de dépendances ou de schéma Prisma rebuilde l'image.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-4001}:3000"
    environment:
      DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD:-fitness}@db:5432/fitness
      KIE_API_KEY: ${KIE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Le calendrier de suivi utilise la date locale du serveur.
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync+restart
          path: ./next.config.ts
          target: /app/next.config.ts
        - action: sync+restart
          path: ./postcss.config.mjs
          target: /app/postcss.config.mjs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./prisma

volumes:
  db-data:
