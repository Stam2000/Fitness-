services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness}
      POSTGRES_DB: fitness
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Migrations + seed à la demande, pour une intervention manuelle :
  #   docker compose run --rm --build migrate
  # Aucun service n'en dépend : `app` et `dev` appliquent eux-mêmes leurs
  # migrations au démarrage. Un conteneur d'amorçage dont dépend le démarrage
  # de l'app transforme le moindre incident en déploiement figé sans message.
  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: builder
    command: >
      sh -ce "
      echo '→ prisma migrate deploy' ;
      timeout 180 ./node_modules/.bin/prisma migrate deploy ;
      echo '→ prisma db seed' ;
      timeout 180 ./node_modules/.bin/prisma db seed ;
      echo '✓ base prête'
      "
    environment:
      DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD:-fitness}@db:5432/fitness
      # La CLI Prisma interroge checkpoint.prisma.io au lancement (vérification de
      # version). Sur un serveur au réseau sortant filtré, cet appel peut traîner.
      CHECKPOINT_DISABLE: "1"
    depends_on:
      db:
        condition: service_healthy

  # Fournisseur de « PO tokens » pour yt-dlp (plugin bgutil, installé dans
  # l'image app/dev) : YouTube exige ces jetons des IP de datacenter, sans
  # quoi les téléchargements échouent en vérification anti-robot. Service
  # interne au réseau compose, aucun port publié.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:3000"
    environment:
      DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD:-fitness}@db:5432/fitness
      KIE_API_KEY: ${KIE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Cookies YouTube pour yt-dlp (vérification anti-robot) : chemin d'un
      # export Netscape. À défaut, /app/data/media/cookies/cookies.txt est
      # utilisé s'il existe (déposable via `docker compose cp`).
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      # URL du fournisseur de PO tokens (service pot-provider ci-dessus).
      POT_PROVIDER_URL: ${POT_PROVIDER_URL:-http://pot-provider:4416}
      # Le calendrier de suivi utilise la date locale du serveur.
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # Médias rapatriés depuis Kie.ai (leurs URLs expirent) : persistant.
      # Sous Coolify : déclarer un « Persistent Storage » sur /app/data/media.
      - media-data:/app/data/media
    depends_on:
      db:
        condition: service_healthy

  # Mode développement avec mise à jour automatique : `next dev` + HMR.
  # Lancer avec : docker compose --profile dev watch dev
  # Chaque modification du code est synchronisée dans le conteneur (rechargement
  # instantané) ; un changement de dépendances ou de schéma Prisma rebuilde l'image.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    # Mêmes migrations au démarrage que le conteneur de production.
    command: >
      sh -ce "
      ./node_modules/.bin/prisma migrate deploy ;
      node prisma/seed.mjs ;
      npm run dev
      "
    ports:
      - "${DEV_PORT:-4001}:3000"
    environment:
      DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD:-fitness}@db:5432/fitness
      KIE_API_KEY: ${KIE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Cookies YouTube pour yt-dlp — voir le commentaire du service « app ».
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      # URL du fournisseur de PO tokens (service pot-provider).
      POT_PROVIDER_URL: ${POT_PROVIDER_URL:-http://pot-provider:4416}
      # Le calendrier de suivi utilise la date locale du serveur.
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - media-data:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync+restart
          path: ./next.config.ts
          target: /app/next.config.ts
        - action: sync+restart
          path: ./postcss.config.mjs
          target: /app/postcss.config.mjs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./prisma

volumes:
  db-data:
  media-data:
